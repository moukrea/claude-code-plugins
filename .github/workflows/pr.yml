name: PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck

      - name: Validate plugins
        run: |
          chmod +x .github/scripts/validate-plugins.sh
          .github/scripts/validate-plugins.sh
